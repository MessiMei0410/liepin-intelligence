[runtime]
max_workers = 3
copilot_max_skills = 3

[model]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
timeout_seconds = 60
retry_attempts = 3
keychain_service = "a-system-agent-deepseek"
keychain_account = "api.deepseek.com"

[automation]
high_score = 75
low_score = 55
min_confidence = 0.80
min_evidence_coverage = 0.75

[skills]
enabled = ["job_diagnosis", "candidate_assessment", "verification_plan", "communication_draft", "liepin_resume_capture", "opencli_usage", "opencli_browser_read", "document_understanding", "job_intake", "jd_calibration", "job_library_update", "talent_pool_search", "search_strategy", "multi_channel_sourcing", "job_publish_prepare", "job_publish_execute", "resume_export", "candidate_batch_assessment", "matching_report", "recommendation_report", "client_recommendation", "reply_triage", "communication_draft_batch", "outreach_prepare", "outreach_execute", "identity_merge_preflight", "interview_followup", "salary_verification", "salary_negotiation", "decision_coaching", "offer_confirmation", "onboarding_followup", "project_retrospective", "memory_capture"]

[memory]
enabled = true
mode = "active"
candidate_limit = 12
result_limit = 5

[learning]
minimum_support = 3
minimum_candidates = 2
contradiction_window = 10
pause_rate = 0.30

[ui]
copilot_default_open = true
flow_poll_seconds = 30
